{% extends 'complaints/base.html' %}
{% block content %}
<div class="report-form-wrapper">
    <div class="report-card">
        <h2 style="color: var(--brand-cyan); margin-bottom: 1.5rem;">Report a Problem</h2>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}

            <div id="locationStatus" class="location-status">
                <span id="locationStatusText">📍 Detecting your location…</span>
                <button type="button" id="retryLocationBtn" class="btn-retry-location">Try Again</button>
            </div>

            <div id="map"></div>
            <input type="hidden" name="latitude" id="lat">
            <input type="hidden" name="longitude" id="lng">
            <button type="submit" class="btn-submit-report full-width-mobile">Submit Complaint</button>
        </form>
    </div>
</div>

<style>
    .report-form-wrapper {
        max-width: 820px;
        width: 100%;
        margin: 0 auto;
    }

    .report-card {
        background: #FFFFFF;
        border: 1px solid var(--border-dim);
        border-radius: 20px;
        box-shadow: var(--shadow-md);
        padding: 2rem;
    }

    .location-status {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        flex-wrap: wrap;
        background: var(--brand-cyan-glow);
        border: 1px solid var(--brand-cyan);
        border-radius: 12px;
        padding: 0.65rem 1rem;
        margin-bottom: 1rem;
        font-size: 0.85rem;
        color: var(--brand-cyan-deep);
        font-weight: 600;
    }

    .location-status.status-success {
        background: rgba(52, 199, 89, 0.12);
        border-color: var(--accent-green);
        color: #1F8A3B;
    }

    .location-status.status-failed {
        background: rgba(255, 159, 10, 0.1);
        border-color: #B36B00;
        color: #B36B00;
    }

    .btn-retry-location {
        background: #FFFFFF;
        border: 1.5px solid currentColor;
        color: inherit;
        border-radius: 30px;
        padding: 0.35rem 0.9rem;
        font-size: 0.78rem;
        font-weight: 700;
        cursor: pointer;
        transition: 0.2s;
        display: none;
    }

    .btn-retry-location:hover {
        background: currentColor;
        filter: brightness(0.95);
    }

    .btn-retry-location.visible {
        display: inline-block;
    }

    #map {
        height: 320px;
        width: 100%;
        margin-bottom: 1.25rem;
        border-radius: 18px;
        overflow: hidden;
        border: 1px solid var(--border-dim);
    }

    form p {
        margin-bottom: 1rem;
    }

    form label {
        font-weight: 600;
        color: var(--text-secondary);
        display: block;
        margin-bottom: 0.3rem;
    }

    form input[type="text"],
    form textarea,
    form select,
    form input[type="file"] {
        width: 100%;
        border: 1px solid var(--border-dim);
        border-radius: 10px;
        padding: 0.6rem 0.8rem;
        color: var(--text-primary);
        background: #FFFFFF;
    }

    form input:focus,
    form textarea:focus,
    form select:focus {
        outline: none;
        border-color: var(--brand-cyan);
        box-shadow: 0 0 0 3px var(--brand-cyan-glow);
    }

    .btn-submit-report {
        background: var(--brand-cyan);
        color: #FFFFFF;
        border: none;
        border-radius: 40px;
        padding: 0.75rem 2rem;
        font-weight: 700;
        cursor: pointer;
        transition: 0.2s;
    }

    .btn-submit-report:hover {
        background: var(--brand-cyan-deep);
        transform: translateY(-2px);
    }

    @media (max-width: 768px) {
        .report-card {
            padding: 1.2rem;
        }

        #map {
            height: 240px;
        }

        .report-form-wrapper {
            padding: 0 0.5rem;
        }

        .full-width-mobile {
            width: 100%;
        }

        .location-status {
            font-size: 0.8rem;
        }
    }
</style>

{% endblock %}

{% block extra_js %}
<script>
    const defaultLat = 9.0765;
    const defaultLng = 7.3986;

    // enableHighAccuracy: true actually engages the phone's GPS chip instead of
    // the faster-but-coarser Wi-Fi/cell-tower positioning. GPS cold starts
    // (indoors, weak signal, first fix of the session) can take well over 10
    // seconds, so the timeout needs real room to let that happen.
    const geolocationOptions = {
        enableHighAccuracy: true,
        timeout: 15000,
        maximumAge: 0
    };

    var map = L.map('map').setView([defaultLat, defaultLng], 13);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
        attribution: '© OpenStreetMap contributors © CARTO',
        maxZoom: 19
    }).addTo(map);

    var marker;
    var userPickedManually = false;

    const statusBox = document.getElementById('locationStatus');
    const statusText = document.getElementById('locationStatusText');
    const retryBtn = document.getElementById('retryLocationBtn');

    function setStatus(mode, text) {
        statusBox.classList.remove('status-success', 'status-failed');
        if (mode === 'success') statusBox.classList.add('status-success');
        if (mode === 'failed') statusBox.classList.add('status-failed');
        statusText.textContent = text;
        retryBtn.classList.toggle('visible', mode === 'failed');
    }

    function setMarker(lat, lng, zoom = 15) {
        if (marker) map.removeLayer(marker);
        marker = L.marker([lat, lng]).addTo(map);
        document.getElementById('lat').value = lat;
        document.getElementById('lng').value = lng;
        map.setView([lat, lng], zoom, { animate: true, duration: 0.5 });
    }

    map.on('click', function (e) {
        userPickedManually = true;
        setMarker(e.latlng.lat, e.latlng.lng, 16);
        setStatus('success', '📍 Location set manually on the map');
    });

    // Seed the form immediately with a safe fallback point so the submission is never blocked on location discovery.
    setMarker(defaultLat, defaultLng, 13);

    function detectLocation() {
        if (!navigator.geolocation) {
            setStatus('failed', '⚠️ Your browser doesn\'t support location detection — tap the map to set it manually.');
            return;
        }

        setStatus('detecting', '📍 Detecting your location…');

        navigator.geolocation.getCurrentPosition(
            function (position) {
                if (userPickedManually) return;
                var lat = position.coords.latitude;
                var lng = position.coords.longitude;
                setMarker(lat, lng, 15);
                setStatus('success', '📍 Location detected');
            },
            function (error) {
                console.log('Geolocation unavailable or denied:', error.message);
                if (userPickedManually) return;
                setStatus('failed', '⚠️ Couldn\'t detect your location — tap the map to set it manually, or try again.');
            },
            geolocationOptions
        );
    }

    retryBtn.addEventListener('click', function () {
        userPickedManually = false;
        detectLocation();
    });

    detectLocation();
</script>
{% endblock %}
