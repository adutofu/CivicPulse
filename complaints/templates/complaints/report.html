{% extends 'complaints/base.html' %}
{% block content %}
<h2>Report a Problem</h2>
<div class="report-form-wrapper">
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <div id="map"></div>
        <input type="hidden" name="latitude" id="lat">
        <input type="hidden" name="longitude" id="lng">
        <button type="submit" class="btn btn-primary full-width-mobile">Submit Complaint</button>
    </form>
</div>

<style>
    .report-form-wrapper {
        max-width: 820px;
        width: 100%;
        margin: 0 auto;
    }

    #map {
        height: 320px;
        width: 100%;
        margin-bottom: 1.25rem;
        border-radius: 18px;
        overflow: hidden;
    }

    form p {
        margin-bottom: 1rem;
    }

    @media (max-width: 768px) {
        #map {
            height: 240px;
        }

        .report-form-wrapper {
            padding: 0 0.5rem;
        }

        .full-width-mobile {
            width: 100%;
        }
    }
</style>

{% endblock %}

{% block extra_js %}
<script>
    var map = L.map('map').setView([9.0765, 7.3986], 13);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
        attribution: '© OpenStreetMap contributors © CARTO',
        maxZoom: 19
    }).addTo(map);
    var marker;
    var userPickedManually = false;  // NEW: tracks if citizen already chose a spot

    function setMarker(lat, lng) {
        if (marker) map.removeLayer(marker);
        marker = L.marker([lat, lng]).addTo(map);
        document.getElementById('lat').value = lat;
        document.getElementById('lng').value = lng;
    }

    map.on('click', function (e) {
        userPickedManually = true;      // citizen took control — never auto-override after this
        setMarker(e.latlng.lat, e.latlng.lng);
    });

    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
            function (position) {
                if (userPickedManually) return;  // NEW: respect the citizen's manual choice
                var lat = position.coords.latitude;
                var lng = position.coords.longitude;
                console.log('Geolocation accuracy (meters):', position.coords.accuracy);  // diagnostic
                map.setView([lat, lng], 15);
                setMarker(lat, lng);
            },
            function (error) {
                console.log('Geolocation unavailable or denied:', error.message);
            }
        );
    }
</script>
{% endblock %}
